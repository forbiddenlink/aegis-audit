# Dependabot config — uv ecosystem (Python)
# The `uv` ecosystem updates pyproject.toml AND uv.lock together. The old `pip`
# ecosystem bumped only the pyproject pins, leaving uv.lock stale after every
# merge (CI installs from the lock via `uv sync`, so the two must stay in step).
# Grouped patch/minor updates to reduce PR spam.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      patch-and-minor:
        update-types:
          - "patch"
          - "minor"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 3
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    cooldown:
      default-days: 7