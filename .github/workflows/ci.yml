name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff linting
        run: |
          ruff check aegisaudit/ tests/

      - name: Run ruff formatting check
        run: |
          ruff format --check aegisaudit/ tests/

      - name: Run type checking with mypy
        run: |
          mypy aegisaudit/

      - name: Run tests with coverage
        run: |
          pytest --cov=aegisaudit --cov-report=xml --cov-report=term-missing --cov-fail-under=60

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install AegisAudit
        run: |
          pip install .

      # This step is the tool's own dogfood gate, so it must be allowed to fail.
      # It was previously continue-on-error, which hid a crash: the HTML
      # reporter raised FileNotFoundError for every installed copy of the
      # package (the Jinja2 template was not shipped in the wheel) and CI stayed
      # green for the entire life of the bug.
      #
      # Suppressions live in .aegisignore.
      - name: Run self-scan on repository
        run: |
          aegis audit . --out ./scan-results --format sarif,html --fail-on high

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        if: always()
        with:
          sarif_file: scan-results/report.sarif
          category: aegis-self-audit

      - name: Upload HTML Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: security-audit-report
          path: scan-results/report.html
          if-no-files-found: warn
