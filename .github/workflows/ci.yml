name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Least privilege: this workflow only reads the repo. An explicit floor keeps
# the token read-only even if the repo default is ever widened.
permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Install from uv.lock rather than `pip install -e .[dev]`. Plain pip
      # resolves the dev tools to their latest release, which pulled ruff 0.16.2
      # despite the `<0.9` pin and failed CI on version drift instead of on the
      # code. `uv sync` installs the exact, hash-locked versions the repo is
      # developed against (ruff 0.8.6), so CI matches local.
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: |
          uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run ruff linting
        run: |
          uv run ruff check aegisaudit/ tests/

      - name: Run ruff formatting check
        run: |
          uv run ruff format --check aegisaudit/ tests/

      - name: Run type checking with mypy
        run: |
          uv run mypy aegisaudit/

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=aegisaudit --cov-report=xml --cov-report=term-missing --cov-fail-under=60

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install AegisAudit
        run: |
          pip install .

      # This step is the tool's own dogfood gate, so it must be allowed to fail.
      # It was previously continue-on-error, which hid a crash: the HTML
      # reporter raised FileNotFoundError for every installed copy of the
      # package (the Jinja2 template was not shipped in the wheel) and CI stayed
      # green for the entire life of the bug.
      #
      # Suppressions live in .aegisignore.
      - name: Run self-scan on repository
        run: |
          aegis audit . --out ./scan-results --format sarif,html --fail-on high

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        if: always()
        with:
          sarif_file: scan-results/report.sarif
          category: aegis-self-audit

      - name: Upload HTML Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: security-audit-report
          path: scan-results/report.html
          if-no-files-found: warn
