name: Dependabot auto-merge
# Auto-merges dependabot patch + minor PRs once CI passes. Major updates stay manual.
on: pull_request_target # zizmor: ignore[dangerous-triggers] required for Dependabot metadata; no PR code is checked out or executed
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Integrity gate: block auto-merge if the update pulls in a dependency with
      # a known high/critical advisory or a denied license. Runs before the merge
      # step, so a failure here stops the auto-merge. Uses the GitHub dependency
      # graph diff (no PR code is executed), safe under pull_request_target.
      - name: Checkout (base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
      - name: Enable auto-merge (patch + minor only)
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
