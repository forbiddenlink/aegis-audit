[project]
name = "aegisaudit"
version = "0.1.0"
description = "Security posture reports for modern web apps."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Elizabeth Stein" }]
keywords = ["security", "scanner", "sast", "sarif", "headers", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dependencies = [
    # Upper bounds keep `uv lock --upgrade` from silently crossing a major and
    # breaking the build unreviewed; Dependabot's grouped PRs are the sanctioned
    # upgrade path.
    "httpx>=0.27.0,<1.0",
    "typer>=0.9.0,<1.0",
    "pydantic>=2.0.0,<3.0",
    "rich>=13.0.0,<16.0",
    "jinja2>=3.1.0,<4.0",
    "pyyaml>=6.0.0,<7.0",
    "dnspython>=2.4.0,<3.0",
    # Python dependency vulnerability scanning. Declared so `aegis audit`
    # actually runs the check rather than silently no-opping when the binary is
    # absent (the failure mode of the old `safety` shell-out). npm audit stays
    # best-effort since Node cannot be bundled.
    "pip-audit>=2.7.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/forbiddenlink/aegis-audit"
Repository = "https://github.com/forbiddenlink/aegis-audit"
Issues = "https://github.com/forbiddenlink/aegis-audit/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-cov>=4.1.0,<8.0",
    "pytest-asyncio>=0.23.0,<2.0",
    "pytest-mock>=3.12.0,<4.0",
    # Pinned to a narrow range: an unpinned ruff floor pulled a newer release
    # whose default rules flagged 200+ pre-existing issues, turning CI red on
    # dependency-only PRs. Bump deliberately via a reviewed PR.
    "ruff>=0.8.0,<0.17",
    "mypy>=1.14.0,<2.0",
    "types-PyYAML>=6.0.0,<7.0",
    "pre-commit>=4.0.0,<5.0",
    # Used by tests/test_sarif.py to validate SARIF output against the official
    # 2.1.0 schema. Without it that test silently skips in every environment.
    "jsonschema>=4.0.0,<5.0",
]

[project.scripts]
aegis = "aegisaudit.cli:app"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
# Scoped rather than global: a blanket ignore_missing_imports silently turns any
# future untyped dependency into Any instead of a strict-mode error. List the
# specific untyped modules here so strict mode stays meaningful.
[[tool.mypy.overrides]]
module = ["pip_audit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -q --asyncio-mode=auto --cov=aegisaudit --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["aegisaudit"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
